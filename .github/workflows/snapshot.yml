name: Refresh offline house list
# Manual only ("Run workflow"). Pulls the live public snapshot, validates it, rebuilds the static pages
# and opens a pull request. Run once at content freeze and after any late change.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/snapshot-pull.mjs
      - run: npm run build
      - name: Open pull request when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Nothing to refresh."; exit 0; fi
          branch="chore/refresh-snapshot-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/halloween-2026.public.json index.html halloween christmas 404.html offline.html sw.js assets/js/legacy-redirect.js
          git commit -m "chore: refresh offline house list from the live snapshot"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh offline house list" --body "Automated snapshot refresh (manual workflow). Review the data diff, then merge."
