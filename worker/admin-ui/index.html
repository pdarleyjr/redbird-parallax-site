<!doctype html>
<html lang="en" data-theme="halloween">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Red Bird Trails Admin</title>
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="admin.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="adm-header">
    <div class="adm-bar">
      <strong class="adm-title">Red Bird Trails <span>Admin</span></strong>
      <nav id="tabs" aria-label="Admin sections">
        <button type="button" data-tab="houses" aria-current="page">Houses</button>
        <button type="button" data-tab="import">Import</button>
        <button type="button" data-tab="versions">Versions</button>
        <button type="button" data-tab="events">Events</button>
        <button type="button" data-tab="activity">Activity</button>
      </nav>
      <span id="who" class="muted"></span>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <p id="notice" role="status" aria-live="polite" class="notice" hidden></p>
    <div id="view"></div>
  </main>
  <dialog id="editor" aria-labelledby="editor-title"></dialog>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-body"></p>
      <div class="row"><button value="cancel">Cancel</button><button value="ok" class="primary" id="confirm-ok">Confirm</button></div></form>
  </dialog>
</body>
</html>
